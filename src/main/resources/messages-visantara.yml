# ==================== VisantaraPunish Messages ====================
messages:
  # System Messages
  prefix: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &f"
  no-permission: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou don't have permission to use this command!"
  player-only: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cThis command can only be used by players!"
  player-not-found: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cPlayer not found!"
  player-not-online: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cPlayer is not online!"
  invalid-duration: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cInvalid duration format! Use: 10m, 1h, 1d, etc."
  invalid-id: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cInvalid ID! Check your config.yml"
  unknown-subcommand: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cUnknown subcommand!"
  reload-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &aConfiguration reloaded successfully!"

  # Divider for broadcasts
  divider: "&b&m                                                      "

  # Ban Messages
  ban-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have banned &c%player% &ffor: &c%reason%"
  tempban-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have temporarily banned &c%player% &ffor &c%duration% &f- Reason: &c%reason%"
  unban-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have unbanned &c%player%"
  ban-kick: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ\n\n&fYou have been banned!\n&fReason: &c%reason%\n&fBanned by: &c%staff%\n\n&fAppeal at: &cdiscord.gg/yourserver"

  # IP Ban Messages
  banip-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have IP banned &c%player% &f(&c%ip%&f) for: &c%reason%"
  unbanip-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have unbanned IP &c%ip%"
  banip-kick: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ\n\n&fYour IP has been banned!\n&fReason: &c%reason%\n&fBanned by: &c%staff%"

  # Mute Messages
  mute-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have muted &c%player% &ffor: &c%reason%"
  tempmute-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have temporarily muted &c%player% &ffor &c%duration% &f- Reason: &c%reason%"
  unmute-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have unmuted &c%player%"
  muted: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have been muted for: &c%reason%\n&fMuted by: &c%staff%\n&fDuration: &c%duration%"
  unmuted: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have been unmuted by &c%staff%"
  currently-muted: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou are currently muted and cannot chat!"

  # Kick Messages
  kick-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have kicked &c%player% &ffor: &c%reason%"
  kick-message: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ\n\n&fYou have been kicked!\n&fReason: &c%reason%\n&fKicked by: &c%staff%"

  # Warning Messages
  warn-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have warned &c%player% &f(Total: %total_points%)\nReason: &c%reason%"
  unwarn-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou removed &c%points_removed% &fpoints from &c%player%. \n(Total: &c%total_points%&f)"
  points-warn-failed: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cPoints must be a number!"
  warned: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have been warned!\n&fReason: &c%reason% &7(&6+%points_added% Points&7)\n&fWarned by: &c%staff%\n&fTotal Points: &c%total_points%"

  # Appeal Messages
  appeal-submitted: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &aAppeal submitted successfully! Please wait for staff review."
  appeal-cooldown: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou already have a pending appeal or are on cooldown."
  appeal-not-punished: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou are not currently muted."
  appeal-notify-staff: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &e%player% &7has submitted a new appeal! &f(Check /punish appeal)"
  appeal-accepted-player: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &aYour appeal has been APPROVED by &f%staff%&a. You are now unmuted!"
  appeal-rejected-player: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYour appeal has been REJECTED by &f%staff%&c. Please wait for the cooldown to expire."

  # --- Appeal Admin Actions ---
  appeal-approved-staff: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &aYou have approved the appeal for &f%player%"
  appeal-rejected-staff: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou have rejected the appeal for &f%player%"

  # --- Active Punishment Hint ---
  active-item-hint: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &7To remove this punishment, use &f/unban %player% &7or &f/unmute %player%"

  # Staff Alert Messages
  staff-alt-alert: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &e%player% &fjoined, linked to banned account: &c%alt%"

  # Chat Filter Messages
  filter-blocked: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYour message was blocked due to inappropriate content!"
  filter-notify: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &e%player% &ftried to say: &7%message% &f(filtered: &c%word%&f)"

  # Info Messages
  info-header: "&bPlayer Information: &f%player%"
  info-uuid: "&fUUID: &c%uuid%"
  info-warnings: "&fWarning Points: &c%warnings%"
  info-first-join: "&fFirst Join: &c%date%"
  info-last-seen: "&fLast Seen: &c%date%"
  info-ips: "&fIP Addresses: &c%ips%"
  info-alts: "&fPossible Alts: &c%alts%"

  # --- History Configuration ---
  history-header: "&8&m----------&r &bHistory: &f%player% &7(Page %page%/%total_pages%) &8&m----------"
  history-empty: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &7No history found for &f%player%"
  history-format: "&8• &c%type% &7(%date%)\n  &8» &fReason: &7%reason%"
  history-footer: "&7Tip: Use &f/history gui %player% &7for GUI mode.\n&8&m----------------------------------------"

  # --- Navigation & Hovers ---
  history-nav-next: "&b[NEXT]"
  history-nav-prev: "&b[PREV]"
  history-nav-next-hover: "&7Click to go to page %page%"
  history-nav-prev-hover: "&7Click to go to page %page%"
  history-nav-pages: " &fPage %page%/%total_pages% "

  # Hover when cursor is on punishment line
  history-item-hover:
    - "&bPunishment Detail"
    - "&fType: &7%type%"
    - "&fStaff: &b%staff%"
    - "&fDate: &7%date%"
    - "&fDuration: &f%duration%"
    - "&fReason: &c%reason%"

    # --- Active Punishment GUI ---
  active-gui-no-data: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &7There are no active punishments to display."
  active-gui-unpunish-attempt: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fAttempting to unpunish &c%player%&f..."

  # Broadcast Messages
  broadcast:
    ban: "      &cPLAYER BANNED\n \n&fPlayer: &c%player%\n&fStaff: &b%staff%\n&fReason: &c%reason%"
    kick: "      &cPLAYER KICKED\n \n&fPlayer: &c%player%\n&fStaff: &b%staff%\n&fReason: &c%reason%"
    mute: "      &cPLAYER MUTED\n \n&fPlayer: &c%player%\n&fStaff: &b%staff%\n&fReason: &c%reason%"
    tempmute: "      &cPLAYER MUTED\n \n&fPlayer: &c%player%\n&fStaff: &b%staff%\n&fReason: &c%reason%"
    duration: "&fDuration: &c%duration%"

  # Jail Success/Failure
  jail-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have jailed &c%player% &fin cell &c%cell% &ffor &c%duration%"
  jail-failed: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cFailed to jail player!"
  jail-system-disabled: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cJail system is currently disabled!"

  # Unjail
  unjail-success: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fYou have released &c%player% &ffrom jail"
  unjail-failed: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cFailed to release player!"
  jail-not-jailed: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &c%player% &fis not jailed!"
  jail-released: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &aYou have been released from jail by &f%releaser%"

  # Jail Broadcast
  jail-broadcast: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &c%player% &fhas been jailed by &c%staff% &fin cell &c%cell%\n&fReason: &c%reason%"

  # Jailed Player Messages
  jailed:
    - "&b&m                                                      "
    - "&cYou have been JAILED!"
    - ""
    - "&fCell: &c%cell%"
    - "&fReason: &c%reason%"
    - "&fJailed by: &c%staff%"
    - "&fDuration: &c%duration%"
    - "&fLabor Required: &c%labor% blocks"
    - ""
    - "&7You must break &c%labor% blocks &7to earn your freedom!"
    - "&7Use &f/jailstatus &7to check your progress"
    - "&b&m                                                      "

  # Jail Status
  jail-status:
    - "&b&m          &bJail Status&b&m          "
    - "&fPlayer: &c%player%"
    - "&fCell: &c%cell%"
    - "&fStaff: &c%staff%"
    - "&fReason: &c%reason%"
    - "&fTime Remaining: &c%time_remaining%"
    - "&fLabor Progress: &c%labor_progress%&7/&c%labor_required% &7(&c%labor_percentage%%&7)"
    - "&b&m                                            "

  # Labor Messages
  jail-labor-complete: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &aLabor Complete! &7Wait for time to expire..."
  jail-wrong-block: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou must break &f%block% &cblocks!"
  jail-wrong-location: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou must break blocks at the designated labor area!"
  jail-labor-disabled: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cLabor system is disabled!"
  jail-block-place: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou cannot place blocks!"

  # Restrictions
  jail-no-teleport: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou cannot teleport while jailed!"
  jail-escape-attempt: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cDon't try to escape!"
  jail-command-blocked: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou cannot use commands while jailed!"
  jail-chat-blocked: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou cannot chat while jailed!"
  jail-no-drop: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou cannot drop items while jailed!"

  # Admin Messages
  jail-cell-set: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fCell &c%cell% &fset at &c%x%, %y%, %z%"
  jail-cell-removed: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fCell &c%cell% &fremoved"
  jail-cell-not-found: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cCell &f%cell% &cdoes not exist!"
  jail-no-cells: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cNo jail cells configured!"

  jail-spawner-set: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fSpawner added to cell &c%cell% &fat &c%x%, %y%, %z%"
  jail-spawner-removed: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fSpawner removed from cell &c%cell%"
  jail-no-spawners: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cNo spawners configured for cell &f%cell%"

  invalid-labor: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cInvalid labor amount! Must be a positive number."
  invalid-coordinates: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cInvalid coordinates!"

  # Release Location
  jail-release-set: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &fRelease location set at &c%x%, %y%, %z%"
  jail-teleported-on-join: "&bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ &8» &cYou are still jailed! Teleported to cell &f%cell%"

  # Help Messages
  help-header: "&b&m          &bᴠɪsᴀɴᴛᴀʀᴀᴘᴜɴɪsʜ Help &b&m          "
  help-reload: "&f/quantumpunish reload &8- &bReload configuration"
  help-footer: "&b&m                                            "


  # Usage Messages
  usage:
    ban: "&b&m                                            \n &b&nCommand:&r &f/ban\n &b&nUsage:&r &c/ban <player> <reason>\n&b&m                                            "
    ban-id: "&b&m                                            \n &b&nCommand:&r &f/ban\n &b&nUsage:&r &c/ban <player> <id>\n&b&m                                            "
    tempban: "&b&m                                            \n &b&nCommand:&r &f/tempban\n &b&nUsage:&r &c/tempban <player> <reason> <duration>\n&b&m                                            "
    unban: "&b&m                                            \n &b&nCommand:&r &f/unban\n &b&nUsage:&r &c/unban <player>\n&b&m                                            "
    banip: "&b&m                                            \n &b&nCommand:&r &f/banip\n &b&nUsage:&r &c/banip <player> <reason>\n&b&m                                            "
    unbanip: "&b&m                                            \n &b&nCommand:&r &f/unbanip\n &b&nUsage:&r &c/unbanip <ip>\n&b&m                                            "
    mute: "&b&m                                            \n &b&nCommand:&r &f/mute\n &b&nUsage:&r &c/mute <player> <reason>\n&b&m                                            "
    mute-id: "&b&m                                            \n &b&nCommand:&r &f/mute\n &b&nUsage:&r &c/mute <player> <id>\n&b&m                                            "
    tempmute: "&b&m                                            \n &b&nCommand:&r &f/tempmute\n &b&nUsage:&r &c/tempmute <player> <reason> <duration>\n&b&m                                            "
    unmute: "&b&m                                            \n &b&nCommand:&r &f/unmute\n &b&nUsage:&r &c/unmute <player>\n&b&m                                            "
    kick: "&b&m                                            \n &b&nCommand:&r &f/kick\n &b&nUsage:&r &c/kick <player> <reason>\n&b&m                                            "
    warn: "&b&m                                            \n &b&nCommand:&r &f/warn\n &b&nUsage:&r &c/warn <player> <add/remove> <points> <reason>\n&b&m                                            "
    history: "&b&m                                            \n &b&nCommand:&r &f/history\n &b&nUsage:&r &c/history <player> [page] or /history gui <player>\n&b&m                                            "
    playerinfo: "&b&m                                            \n &b&nCommand:&r &f/playerinfo\n &b&nUsage:&r &c/playerinfo <player>\n&b&m                                            "
    appeal: "&b&m                                            \n &b&nCommand:&r &f/appeal\n &b&nUsage:&r &c/appeal <reason>\n&b&m                                            "
    jail: "&b&m                                            \n &b&nCommand:&r &f/jail\n &b&nUsage:&r &c/jail <player> <duration> <cell> <labor> <reason>\n&b&m                                            "
    unjail: "&b&m                                            \n &b&nCommand:&r &f/unjail\n &b&nUsage:&r &c/unjail <player>\n&b&m                                            "
